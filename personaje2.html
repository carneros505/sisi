<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaje 2</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Sancreek&display=swap" rel="stylesheet">
</head>

<body>
    <div class="bg-transicion bg-transicion-show"></div>

    <div class="bg-personaje">
        <div class="titulo">
            <h1>Jugador 2 - Selecciona tu Personaje</h1>
        </div>

        <div class="personajes">
            <button class="anterior" onclick="anteriorPersonaje()">
                <img src="img/left.png">
            </button>

            <div class="personaje">
                <img id="personaje" src="img/p1.png">
            </div>

            <button class="siguiente" onclick="siguientePersonaje()">
                <img src="img/right.png">
            </button>
        </div>

        <div class="barra">
            <input type="text" id="jugador2" placeholder="Jugador 2" class="txt-nombre">

            <button class="btn-siguiente" onclick="comenzarJuego()">
                Jugar
            </button>
        </div>
    </div>
</body>

<script src="funciones.js"></script>
<script>
    window.addEventListener('load', () => {
        quitarBG();
        personajeActual = 1;
    });
</script>

</html>
